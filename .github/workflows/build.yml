name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path src/resource.h -Pattern 'KA_VERSION_STRING "(.+)"').Matches[0].Groups[1].Value
          "value=$version" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref }}".StartsWith('refs/tags/v') -and "v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match version $version in src/resource.h"
          }

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" installer\KeepAwake.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - uses: actions/upload-artifact@v5
        with:
          name: KeepAwake
          path: |
            build/Release/KeepAwake.exe
            build/installer/KeepAwake-Setup-${{ steps.version.outputs.value }}.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "build/installer/KeepAwake-Setup-${{ steps.version.outputs.value }}.exe" build/Release/KeepAwake.exe --title "KeepAwake ${{ github.ref_name }}" --generate-notes
